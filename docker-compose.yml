services:
  app:
    build: .
    ports:
      - "3000:3000"
    # Settings come from .env. Copy example.env to .env to start.
    env_file:
      - path: .env
        required: false
    volumes:
      - appdata:/data

  # Uncomment the db service below when using PostgreSQL (see the Database section in example.env).
  # db:
  #   image: postgres:16-alpine
  #   environment:
  #     POSTGRES_USER: postgres
  #     POSTGRES_PASSWORD: password
  #     POSTGRES_DB: typstdrive
  #   ports:
  #     - "5433:5432"
  #   volumes:
  #     - pgdata:/var/lib/postgresql/data

  # Uncomment the mysql service below when using MySQL (see the Database section in example.env).
  # mysql:
  #   image: mysql:8.4
  #   command: --character-set-server=utf8mb4 --collation-server=utf8mb4_bin --max-allowed-packet=256M
  #   environment:
  #     MYSQL_ROOT_PASSWORD: rootpassword
  #     MYSQL_DATABASE: typstdrive
  #     MYSQL_USER: typstdrive
  #     MYSQL_PASSWORD: password
  #   volumes:
  #     - mysqldata:/var/lib/mysql

  # Uncomment the valkey service below when REDIS_URL is set in .env.
  # valkey:
  #   image: valkey/valkey:8-alpine

  # Uncomment the rustfs service below when S3_BUCKET is set in .env.
  # Console: http://localhost:9001 (sign in with the access key and secret key, then create the bucket).
  # rustfs:
  #   image: rustfs/rustfs:latest
  #   environment:
  #     - RUSTFS_VOLUMES=/data
  #     - RUSTFS_ADDRESS=0.0.0.0:9000
  #     - RUSTFS_CONSOLE_ADDRESS=0.0.0.0:9001
  #     - RUSTFS_CONSOLE_ENABLE=true
  #     - RUSTFS_ACCESS_KEY=rustfsadmin
  #     - RUSTFS_SECRET_KEY=rustfsadmin
  #   ports:
  #     - "9001:9001"
  #   volumes:
  #     - rustfsdata:/data

volumes:
  appdata:
  # pgdata:       # Uncomment when using PostgreSQL
  # mysqldata:    # Uncomment when using MySQL
  # rustfsdata:   # Uncomment when using RustFS
