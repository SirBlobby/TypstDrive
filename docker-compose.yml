services:
  app:
    build: .
    ports:
      - "3000:3000"
    environment:
      # --- Required ---
      # SQLite (default, single-volume, no extra container):
      - DATABASE_URL=sqlite:///data/typstdrive.db?mode=rwc
      - DB_TYPE=sqlite
      # PostgreSQL alternative (uncomment the db service below):
      # - DATABASE_URL=postgres://postgres:password@db:5432/typstdrive
      # - DB_TYPE=postgres
      # MySQL / MariaDB alternative (uncomment the mysql service below):
      # - DATABASE_URL=mysql://typstdrive:password@mysql:3306/typstdrive
      # - DB_TYPE=mysql

      # --- Optional ---
      # Server listen port (default: 3000, also update the ports mapping above)
      # - PORT=3000
      # Path to compiled frontend assets (default: /app/build)
      # - STATIC_DIR=/app/build
      # 64+ byte secret for signing session cookies.
      # Without this, sessions are cleared on every container restart.
      # Generate one with: openssl rand -hex 64
      # - COOKIE_SECRET=your-64-plus-byte-secret-here
      # Set to "false" to disable public registration (admin panel can still create users)
      - ALLOW_REGISTRATION=false
      # Log verbosity (default: server=debug,tower_http=debug)
      # - RUST_LOG=info

      # --- Scaling ---
      # Redis or Valkey for real-time collaboration across app instances (uncomment the valkey service below):
      # - REDIS_URL=redis://valkey:6379
      # S3-compatible object storage for uploads (uncomment the rustfs service below and create the bucket first):
      # - S3_BUCKET=typstdrive
      # - S3_ENDPOINT=http://rustfs:9000
      # - S3_ACCESS_KEY_ID=rustfsadmin
      # - S3_SECRET_ACCESS_KEY=rustfsadmin
    volumes:
      - appdata:/data

  # Uncomment the db service below when using PostgreSQL (DB_TYPE=postgres).
  # db:
  #   image: postgres:16-alpine
  #   environment:
  #     POSTGRES_USER: postgres
  #     POSTGRES_PASSWORD: password
  #     POSTGRES_DB: typstdrive
  #   ports:
  #     - "5433:5432"
  #   volumes:
  #     - pgdata:/var/lib/postgresql/data

  # Uncomment the mysql service below when using MySQL (DB_TYPE=mysql).
  # mysql:
  #   image: mysql:8.4
  #   command: --character-set-server=utf8mb4 --collation-server=utf8mb4_bin --max-allowed-packet=256M
  #   environment:
  #     MYSQL_ROOT_PASSWORD: rootpassword
  #     MYSQL_DATABASE: typstdrive
  #     MYSQL_USER: typstdrive
  #     MYSQL_PASSWORD: password
  #   volumes:
  #     - mysqldata:/var/lib/mysql

  # Uncomment the valkey service below when REDIS_URL is set.
  # valkey:
  #   image: valkey/valkey:8-alpine

  # Uncomment the rustfs service below when S3_BUCKET is set.
  # Console: http://localhost:9001 (sign in with the access key and secret key, then create the bucket).
  # rustfs:
  #   image: rustfs/rustfs:latest
  #   environment:
  #     - RUSTFS_VOLUMES=/data
  #     - RUSTFS_ADDRESS=0.0.0.0:9000
  #     - RUSTFS_CONSOLE_ADDRESS=0.0.0.0:9001
  #     - RUSTFS_CONSOLE_ENABLE=true
  #     - RUSTFS_ACCESS_KEY=rustfsadmin
  #     - RUSTFS_SECRET_KEY=rustfsadmin
  #   ports:
  #     - "9001:9001"
  #   volumes:
  #     - rustfsdata:/data

volumes:
  appdata:
  # pgdata:       # Uncomment when using PostgreSQL
  # mysqldata:    # Uncomment when using MySQL
  # rustfsdata:   # Uncomment when using RustFS
