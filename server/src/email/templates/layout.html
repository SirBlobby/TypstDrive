<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<title>{{subject}}</title>
</head>
<body style="margin:0;padding:0;background-color:#f1f4f8;">
<div style="display:none;max-height:0;overflow:hidden;opacity:0;">{{preheader}}</div>
<table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" style="background-color:#f1f4f8;">
<tr>
<td align="center" style="padding:32px 16px;">
<table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" style="max-width:560px;">
<tr>
<td style="padding:0 4px 16px;font-family:Arial,Helvetica,sans-serif;font-size:20px;font-weight:bold;color:{{accent}};">{{{logo}}}{{site_name}}</td>
</tr>
<tr>
<td style="background-color:#ffffff;border:1px solid #dde3ea;border-top:4px solid {{accent}};border-radius:10px;padding:32px;font-family:Arial,Helvetica,sans-serif;font-size:15px;line-height:1.6;color:#1f2933;">
<h1 style="margin:0 0 20px;font-size:22px;line-height:1.3;color:#1f2933;">{{heading}}</h1>
{{{content}}}
</td>
</tr>
<tr>
<td style="padding:16px 4px 0;font-family:Arial,Helvetica,sans-serif;font-size:12px;line-height:1.5;color:#7b8794;">
This email was sent by {{site_name}}{{{site_line}}}. You received it because of activity on your account.
</td>
</tr>
</table>
</td>
</tr>
</table>
</body>
</html>
