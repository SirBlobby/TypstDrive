[package]
name = "server"
version = "2.2.0"
edition = "2021"

[dependencies]
axum = { version = "0.8.9", features = ["ws", "multipart", "macros"] }
axum-extra = { version = "0.12.6", features = ["cookie", "cookie-private", "cookie-signed"] }
tokio = { version = "1.53.3", features = ["full", "macros", "rt-multi-thread"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
sqlx = { version = "0.9.0", features = ["postgres", "sqlite", "mysql", "any", "runtime-tokio", "tls-rustls-ring-webpki", "chrono", "uuid"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
chrono = { version = "0.4.45", features = ["serde"] }
uuid = { version = "1.28.0", features = ["v4", "serde"] }
tower-http = { version = "0.7.1", features = ["fs", "trace", "cors"] }
tower = "0.5.3"
argon2 = "0.6.0"
futures-util = "0.3.34"
ecow = "0.2.6"

typst = { version = "0.15.1", path = "../typst/crates/typst" }
typst-kit = { path = "../typst/crates/typst-kit", features = ["system-downloader", "system-packages", "embedded-fonts", "scan-fonts"] }
typst-pdf = { path = "../typst/crates/typst-pdf" }
typst-render = { path = "../typst/crates/typst-render" }
typst-svg = { path = "../typst/crates/typst-svg" }
typst-html = { path = "../typst/crates/typst-html" }
typst-layout = { path = "../typst/crates/typst-layout" }

yrs = "0.18.8"
yrs-axum = "0.8.2"

tokio-stream = "0.1.19"
tempfile = "3.27.0"
sha2 = "0.11.1"
base64 = "0.23.1"
toml = "1.1.8"
ureq = "2.12.1"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
zip = { version = "9.0.5", default-features = false, features = ["deflate"] }

redis = { version = "0.27", features = ["tokio-comp"] }
object_store = { version = "0.12", features = ["aws"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
cookie = { version = "0.18", features = ["signed"] }
lettre = { version = "0.11", default-features = false, features = ["builder", "hostname", "smtp-transport", "pool", "tokio1", "tokio1-rustls-tls"] }
