site_name: TypstDrive
site_description: Documentation for TypstDrive, a self-hosted collaborative editor for Typst.
site_url: https://sirblobby.github.io/TypstDrive/
repo_url: https://github.com/SirBlobby/TypstDrive
repo_name: SirBlobby/TypstDrive
edit_uri: edit/main/mkdocs/docs/
copyright: TypstDrive is licensed under the Apache License 2.0.

theme:
  name: material
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.footer
    - content.code.copy
    - content.tabs.link
    - search.highlight
    - search.suggest
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  icon:
    repo: fontawesome/brands/github

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

nav:
  - Documentation:
      - Home: index.md
      - Getting Started:
          - Self-Hosting: getting-started/self-hosting.md
          - Configuration: getting-started/configuration.md
          - Authentication: getting-started/authentication.md
          - Email: getting-started/email.md
          - Scaling: getting-started/scaling.md
      - User Guide:
          - The Drive: guide/drive.md
          - Editor: guide/editor.md
          - Projects and Packages: guide/projects-and-packages.md
          - Fonts and Images: guide/fonts-and-images.md
          - Sharing and Permissions: guide/sharing.md
          - Team Spaces: guide/teams.md
          - Account Settings: guide/settings.md
      - Administration:
          - Site Settings: admin/site-settings.md
      - Development: development.md
  - API Reference:
      - Overview: api/index.md
      - POST /v1/render: api/render.md
      - Read Endpoints: api/read.md
      - Examples: api/examples.md
      - Limits and Caching: api/limits.md
      - Desktop Sync API: api/desktop.md
