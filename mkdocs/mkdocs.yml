      - Working together: guide/collaboration.md
      - Presenting: guide/presenting.md
      - Projects: guide/projects.md
      - LaTeX documents: guide/latex.md
      - Packages: guide/packages.md
      - Fonts and images: guide/fonts-and-images.md
      - Citations: guide/citations.md
      - Sharing: guide/sharing.md
      - Team spaces: guide/teams.md
